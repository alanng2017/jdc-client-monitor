<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · 京东云无线宝监控</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body.login-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: min(400px, 100%);
      background: var(--card, #151b2b);
      border: 1px solid #2a3348;
      border-radius: 14px;
      padding: 28px 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    .login-card h1 {
      font-size: 1.25rem;
      margin: 0 0 6px;
    }
    .login-card .sub {
      color: #8b95a8;
      margin: 0 0 18px;
      font-size: .9rem;
    }
    .login-card input[type=password] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #2a3348;
      background: #0d1220;
      color: #e8ecf4;
      font-size: 1rem;
      margin-bottom: 14px;
    }
    .login-card button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #3b82f6;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }
    .login-card button:hover { filter: brightness(1.08); }
    .login-err {
      background: #3a1a1e;
      color: #f87171;
      border: 1px solid #6b3036;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: .9rem;
    }
  </style>
</head>
<body class="login-body">
  <div class="login-card">
    <h1>京东云无线宝监控</h1>
    <p class="sub">请输入访问密码</p>
    {% if err %}
    <div class="login-err">密码错误</div>
    {% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}" />
      <input type="password" name="password" placeholder="访问密码" autofocus required autocomplete="current-password" />
      <button type="submit">登录</button>
    </form>
  </div>
</body>
</html>
