<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>首次设置 · 京东云无线宝监控</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body.login-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: min(420px, 100%);
      background: var(--panel, #1a2332);
      border: 1px solid var(--line, #2a3548);
      border-radius: 14px;
      padding: 28px 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    .login-card h1 { font-size: 1.25rem; margin: 0 0 6px; }
    .login-card .sub { color: var(--muted, #8b9bb4); margin: 0 0 18px; font-size: .9rem; line-height: 1.45; }
    .login-card label { display: block; font-size: .85rem; color: var(--muted); margin: 0 0 6px; }
    .login-card input[type=password] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--line, #2a3548);
      background: #0d1220;
      color: var(--text, #e7ecf3);
      font-size: 1rem;
      margin-bottom: 14px;
    }
    .login-card button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--btn, #2d6cdf);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 4px;
    }
    .login-card button:hover { filter: brightness(1.08); }
    .login-err {
      background: #3a1a1e;
      color: #f87171;
      border: 1px solid #6b3036;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: .9rem;
    }
  </style>
</head>
<body class="login-body">
  <div class="login-card">
    <h1>首次使用 · 设置访问密码</h1>
    <p class="sub">监控页含设备 MAC / 登录态，必须设密码后才能进入。密码保存在本机 <code>data/secrets.json</code>，不上传。</p>
    {% if err == 'short' %}
    <div class="login-err">密码至少 4 位</div>
    {% elif err == 'mismatch' %}
    <div class="login-err">两次输入不一致</div>
    {% elif err %}
    <div class="login-err">设置失败，请重试</div>
    {% endif %}
    <form method="post" action="/setup" autocomplete="off">
      <label for="password">访问密码</label>
      <input id="password" type="password" name="password" placeholder="至少 4 位" autofocus required minlength="4" autocomplete="new-password" />
      <label for="password2">再输入一次</label>
      <input id="password2" type="password" name="password2" placeholder="确认密码" required minlength="4" autocomplete="new-password" />
      <button type="submit">保存并进入</button>
    </form>
  </div>
</body>
</html>
